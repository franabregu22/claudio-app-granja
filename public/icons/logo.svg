<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="eggGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FED766;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo blanco -->
  <rect width="512" height="512" fill="white"/>

  <!-- Huevo (óvalo) con gradiente -->
  <ellipse cx="256" cy="220" rx="140" ry="160" fill="url(#eggGradient)"/>

  <!-- Sol / círculo naranja interior -->
  <circle cx="256" cy="240" r="50" fill="#F5A623"/>

  <!-- Franja de agua (azul claro) -->
  <path d="M 116 260 Q 256 280 396 260 L 396 300 Q 256 320 116 300 Z" fill="#A8D5E8"/>

  <!-- Franja de tierra (verde oscuro) -->
  <ellipse cx="256" cy="350" rx="140" ry="100" fill="#2D5016"/>
</svg>
